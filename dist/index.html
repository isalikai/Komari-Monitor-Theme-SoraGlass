<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Komari Monitor</title>
<meta name="description" content="A simple server monitor tool.">
<link rel="icon" href="assets/icon.svg"><link rel="stylesheet" href="assets/style.v117.css">
</head><body><div id="appLoader" class="app-loader"><div class="loader-card"><div class="loader-ring"></div><div class="loader-title">SoraGlass</div><div class="loader-sub">Loading monitor data…</div></div></div>
<header class="topbar"><div class="wrap topbar-inner"><div class="brand"><div class="mark"><img src="assets/icon.svg" alt=""></div><div><div class="brand-name">SoraGlass</div><div class="brand-sub">Liquid Glass Theme</div></div></div><nav class="nav"><button data-view="table" data-i18n="table">表格</button><button data-view="map" data-i18n="map">地图</button><button data-view="compact" data-i18n="compact">简表</button></nav><div class="actions"><div class="lang"><button data-lang="zh-CN">中</button><button data-lang="en-US">EN</button></div><button class="ghost admin-link" id="adminBtn" data-i18n="admin">后台</button></div></div></header>
<main id="home"><section class="hero"><div class="wrap"><div class="hero-line"><div><div class="kicker" data-i18n="kicker">实时监控</div><h1 id="heroTitle">基础设施</h1><p id="heroSub">实时节点状态与全球资产分布</p></div></div><div class="overview-panel"><div class="overview-left"><div class="overview-head"><div><div class="overview-title" data-i18n="overview">资产概览</div><div class="overview-sub" id="overviewNarrative">--</div></div><div class="overview-score"><small data-i18n="fleetScore">健康指数</small><strong id="fleetScore">0</strong></div></div><div class="overview-grid" id="overviewGrid"></div></div><div class="overview-right"><div class="radar-head"><div><div class="overview-title" data-i18n="radarTitle">运行雷达</div><div class="overview-sub" data-i18n="radarSub">在线率、资源余量与分布活跃度</div></div></div><div class="radar-box"><canvas id="fleetRadar"></canvas></div></div></div><div class="toolbar"><div class="search"><span>⌕</span><input id="searchInput" placeholder="搜索节点、地区、分组"></div><div class="group-filter"><select id="groupSelect" class="select hidden-select" aria-hidden="true" tabindex="-1"></select><div class="group-picker" id="groupPicker"><button type="button" id="groupButton" class="group-button"><span class="group-button-icon">⌘</span><span id="groupButtonText">全部分组</span><i>⌄</i></button><div class="group-menu" id="groupMenu"></div></div></div></div><section class="section view" id="tableView"><div class="table-wrap"><table><thead><tr><th data-i18n="node">节点</th><th data-i18n="status">状态</th><th data-i18n="resource">资源</th><th data-i18n="network">网络</th></tr></thead><tbody id="tableBody"></tbody></table></div></section><section class="section view" id="mapView"><div class="map-layout"><div class="map-panel" id="mapPanel"><svg id="worldSvg" class="map-svg" role="img" aria-label="world map"></svg><div id="mapTip" class="map-tooltip"></div></div><aside class="map-side"><div class="map-subhead" data-i18n="allNodes">所有节点</div><div id="mapNodeList"></div></aside></div></section><section class="section view" id="compactView"><div class="compact-grid" id="compactGrid"></div></section></div></section></main>
<main id="detail" class="detail"><div class="wrap"><button id="backBtn" class="back">← <span data-i18n="back">返回</span></button><div class="node-hero"><div><h2 id="detailTitle">Node</h2><p id="detailSub" class="subtle"></p></div><div id="detailStatus"></div></div><div class="detail-grid"><div style="display:grid;gap:16px"><section class="panel"><div class="panel-head"><div><div class="section-title" data-i18n="realtimeLoad">实时负载</div><div class="hint">CPU / RAM / Disk</div></div><div class="live-pill" id="liveUpdated">Live</div></div><div class="panel-body"><div id="loadGauges" class="gauge-grid"></div></div></section><section class="panel"><div class="panel-head"><div><div class="section-title" data-i18n="latency">延迟检测</div><div class="hint" data-i18n="probe">测速任务</div></div><div class="chart-toolbar"><div class="range" id="pingRange"><button data-hours="1">1h</button><button data-hours="6">6h</button><button data-hours="24">24h</button></div><label class="switch"><input type="checkbox" id="smoothPing"><span data-i18n="smooth">平滑</span></label></div></div><div class="panel-body"><div id="pingChips" class="chip-row"></div><div class="chart-box"><canvas id="pingCanvas"></canvas><div class="chart-tooltip"></div></div></div></section></div><aside class="detail-side"><section class="panel side-tabs-panel"><div class="panel-head compact-head side-tabs-head"><div class="side-tabs-bar"><button class="side-tab-btn active" data-side-tab="asset" data-i18n="asset">资产档案</button><button class="side-tab-btn" data-side-tab="system" data-i18n="system">系统</button><button class="side-tab-btn" data-side-tab="billing" data-i18n="billing">账单信息</button><button class="side-tab-btn" data-side-tab="connections" data-i18n="connections">连接</button></div><div class="side-tab-tools"><span class="side-tab-auto">Auto</span><button class="ghost mini-ghost" id="reloadCharts">↻</button></div></div><div class="panel-body side-tabs-body" id="sideTabsBody"><div class="side-tab-pane active" data-side-pane="asset"><div class="mini-section-title" data-i18n="asset">资产档案</div><div class="kv" id="detailMetrics"></div></div><div class="side-tab-pane" data-side-pane="system"><div class="mini-section-title" data-i18n="system">系统</div><div class="kv" id="assetInfo"></div></div><div class="side-tab-pane" data-side-pane="billing"><div class="mini-section-title" data-i18n="billing">账单信息</div><div id="billingInfo"></div></div><div class="side-tab-pane" data-side-pane="connections"><div class="mini-section-title" data-i18n="connections">连接</div><div id="connectionInfo"></div></div></div></section></aside></div></div></main>
<footer class="foot" id="footer"><span>Powered by Komari Monitor.</span><span class="foot-sep">·</span><span>Theme by <a href="https://github.com/isalikai" target="_blank" rel="noopener noreferrer">isalikai</a></span></footer>
<div class="load-modal" id="loadHistoryModal" aria-hidden="true">
  <div class="load-modal-backdrop" data-load-close></div>
  <div class="load-modal-card" role="dialog" aria-modal="true">
    <div class="load-modal-head">
      <div>
        <div class="load-modal-kicker" id="loadModalKicker">Load History</div>
        <h3 id="loadModalTitle">CPU</h3>
        <p id="loadModalSub">--</p>
      </div>
      <button class="load-modal-close" data-load-close>×</button>
    </div>
    <div class="load-modal-tools">
      <div class="range" id="loadModalRange"><button data-hours="1">1h</button><button data-hours="6">6h</button><button data-hours="24">24h</button></div>
      <label class="switch"><input type="checkbox" id="loadModalSmooth"><span data-i18n="smooth">平滑</span></label>
    </div>
    <div class="load-modal-chart chart-box"><canvas id="loadModalCanvas"></canvas><div class="chart-tooltip"></div></div>
  </div>
</div>
<script src="assets/app.v117.js"></script>
</body></html>
